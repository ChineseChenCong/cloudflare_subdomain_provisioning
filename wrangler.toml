name = "cloudflare-subdomain-provisioning"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "cf"
database_id = "c888cdd9-b2f8-4501-92ab-5d3872406f1e"

[vars]
# ⚠️ 安全说明：以下所有变量均已在（或应在）Cloudflare Dashboard → Worker → 设置 → 变量中直接配置，
# 具体取值（域名、Token、BANNED_PREFIXES 等）只保存在 CF 后台，不得写入本文件（本文件被 git 跟踪）。
# 本地开发调试请把这些变量写入 .dev.vars（已被 .gitignore 忽略，不会进 GitHub）。

# DOMAINS                 → 已在 CF 后台配置（可用父域名，逗号分隔）
# BANNED_PREFIXES         → 已在 CF 后台配置（子域名禁用前缀列表）
# MAX_SUBDOMAINS_PER_USER → 已在 CF 后台配置（每用户最大子域名数）
# MAX_RECORDS_PER_SUBDOMAIN → 已在 CF 后台配置（每子域名最大 DNS 记录数）
# SITE_NAME               → 已在 CF 后台配置（R.O.L. Domain System）
# EMAIL_VERIFICATION_REQUIRED → 已在 CF 后台配置
# ALLOWED_EMAIL_DOMAINS   → 已在 CF 后台配置（邮箱域名白名单）

# ========== 站点外观（可选） ==========
# SITE_BACKGROUND_IMAGE = "https://..."
# SITE_BACKGROUND_OVERLAY = "rgba(15, 23, 42, 0.7)"
# SITE_LOGO = "https://..."

# ========== 友情链接（可选） ==========
# FRIEND_LINKS = '[{"name":"我的博客","url":"https://blog.example.com"}]'

# ========== 联系管理员邮箱（可选，底部显示"联系管理员"按钮） ==========
# ADMIN_CONTACT_EMAIL = "admin@example.com"

# ========== 备案信息（可选，虚拟备案项目，未配置不显示） ==========
# SITE_BEIAN = "浙ICP备12345678号-1"
