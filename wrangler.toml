name = "cloudflare-subdomain-provisioning"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "cf"
database_id = "c888cdd9-b2f8-4501-92ab-5d3872406f1e"

[vars]
# ⚠️ 部署策略（幂等）：以下均为非机密普通变量，正式写入本文件。
# wrangler deploy 会把这些值设为 Worker 线上的同名普通变量 → 部署确定性，
# 这些变量永不“消失”（git 有持久定义，换人换机不丢）。若要改值，直接改本文件再部署即可。
# ⚠️ 加密 Secret（CF_API_TOKEN / RESEND_API_KEY / GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET /
# JWT_SECRET / ENCRYPTION_KEY / SMTP_PASS / ADMIN_USERS）绝不写入本文件（本文件被 git 跟踪），
# 只配置在 Cloudflare Dashboard → Worker → 设置 → 变量（加密），且只存加密。
# 本地调试请用 .dev.vars（已被 .gitignore 忽略，不会进 GitHub）。

ADMIN_CONTACT_EMAIL = "admin@example.com"
ALLOWED_EMAIL_DOMAINS = "example.com,gmail.com,outlook.com"
BANNED_PREFIXES = "www,ns1,ns2,ns,mc,mail,video,tcp,udp,tls,smtp,pop,pop3,imap,ftp,enterpriseenrollment,admin,api,cdn,dev,staging,test,beta,alpha,demo,status,blog,shop,store,app,dashboard,panel,portal,secure,vpn,proxy,relay,mx,mx1,mx2,autoconfig,autodiscover,_dmarc,_domainkey,cpanel,webmail,webdisk,cpcalendars,cpcontacts,ww,ww1,ww2,ww3,dns,dash,gov,edu,ac,pb,voip,abydoss,drs,bg5drs,cc,ddns,icp,365,ts,teamspeak,url,dwz,web,webs,ddos,dos,user,localhost,docs,support,help,about,faq,m,mobile,root,server,host,default,postmaster,hostmaster,webmaster,abuse,info,noreply,download,static,img,assets,media,service,services,gateway,primary,secondary,dns1,dns2,external,webhook"
DOMAINS = "example.com,example.org"
EMAIL_VERIFICATION_REQUIRED = "true"
EMAIL_DAILY_EMAIL_LIMIT = "5"
MAX_RECORDS_PER_SUBDOMAIN = "1000"
MAX_SUBDOMAINS_PER_USER = "5"
# DNS 记录读取：优先从 Cloudflare 实时查（省 D1 读），CF 失败自动回退 D1
DNS_LIVE_READ = "true"
# 上级所有权审批超时（小时）；超时未处理自动驳回。默认 72
OWNER_APPROVAL_DEADLINE_HOURS = "72"
SITE_LOGO = ""
SITE_NAME = "SubDomain Hub"
SMTP_FROM = "noreply@example.com"
SMTP_FROM_NAME = "SubDomain Hub"

# ========== 未提供 / 可选（保持注释；如需可移除 # 启用，仅限非机密） ==========
# SITE_BACKGROUND_IMAGE = "https://..."
# SITE_BACKGROUND_OVERLAY = "rgba(15, 23, 42, 0.7)"
# SITE_BEIAN = "浙ICP备12345678号-1"
FRIEND_LINKS = '[]'
# 存储后端读回退链顺序：custom-sqlite(Turso) 优先、d1 兜底；缺省 d1 = 纯 D1 现状等价。
# 非机密普通变量（幂等写入本文件，保证跨机/重部署不丢）；配合 CUSTOM_SQLITE_URL/TOKEN 生效。
DB_QUERY_ORDER = "custom-sqlite,d1"
# 走 Resend 时 SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS 无需配置（仅 SMTP_FROM / SMTP_FROM_NAME 已启用）

# ===================== 可观测性（wrangler@4 官方推荐 logs/traces 子块） =====================
# 参考 Cloudflare 官方「可观测性」配置，确保各部署设置一致：
#   [observability.logs]   → enabled=true 100% 采样、invocation_logs=true（含调用日志）、
#                            persist=true（日志保留到 Workers 仪表板，配合源码 [audit] 审计行）。
#   [observability.traces] → enabled=true 100% 采样、persist=true（跟踪数据保留到仪表板）。
# 此子块结构仅 wrangler@4 支持（3.x 顶层只认 enabled+head_sampling_rate，故须升级 wrangler@4）。
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
# ===================== 定时自动同步（cron） =====================
# 低频触发 D1 → 镜像后端（MySQL via Hyperdrive / 自定义 SQLite）自动同步（src/services/sync.ts）。
# 仅当你配置了镜像才生效；纯 D1（缺省）时处理器为 no-op，线上行为不变。
# 频率：每天一次（协调世界时 UTC 0 点整，即北京时间 8:00）。如需调整改这里再部署即可。
# 说明：镜像的新鲜度优先靠「写时增量推」(write-through，见 STORAGE.md)；此 cron 仅作
# 全量自愈网/冷对齐，不再承担“实时新鲜”职责，故不需要高频。
[triggers]
crons = ["0 0 * * *"]

# ===================== MySQL（Hyperdrive）绑定（可选，待用户提供→启用） =====================
# Worker 无法原生连 TCP，MySQL 必须经 Cloudflare Hyperdrive。启用步骤见 STORAGE.md：
#   1) Dashboard 创建 Hyperdrive（指向你的 MySQL），拿到 connectionString（加密 Secret，不入本文件）
#   2) 取消下面 `[[hyperdrive]]` 注释，填 name=HYPERDRIVE
#   3) DB_QUERY_ORDER（[vars] 中）设为 "mysql,custom-sqlite,d1"
#   4) `npm i mysql2`
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<你的 Hyperdrive ID>"
