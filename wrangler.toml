name = "cloudflare-subdomain-provisioning"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "cf"
database_id = "c888cdd9-b2f8-4501-92ab-5d3872406f1e"

[vars]
# ⚠️ 部署策略（幂等）：以下均为非机密普通变量，正式写入本文件。
# wrangler deploy 会把这些值设为 Worker 线上的同名普通变量 → 部署确定性，
# 这些变量永不“消失”（git 有持久定义，换人换机不丢）。若要改值，直接改本文件再部署即可。
# ⚠️ 加密 Secret（CF_API_TOKEN / RESEND_API_KEY / GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET /
# JWT_SECRET / ENCRYPTION_KEY / SMTP_PASS / ADMIN_USERS）绝不写入本文件（本文件被 git 跟踪），
# 只配置在 Cloudflare Dashboard → Worker → 设置 → 变量（加密），且只存加密。
# 本地调试请用 .dev.vars（已被 .gitignore 忽略，不会进 GitHub）。

ADMIN_CONTACT_EMAIL = "admin@mail.rol.moe"
ALLOWED_EMAIL_DOMAINS = "mail.rol.moe,rol.moe,mail.kivotos.edu.kg,kivotos.edu.kg"
BANNED_PREFIXES = "www,ns1,ns2,ns,mc,mail,video,tcp,udp,tls,smtp,pop,pop3,imap,ftp,enterpriseenrollment,admin,api,cdn,dev,staging,test,beta,alpha,demo,status,blog,shop,store,app,dashboard,panel,portal,secure,vpn,proxy,relay,mx,mx1,mx2,autoconfig,autodiscover,_dmarc,_domainkey,cpanel,webmail,webdisk,cpcalendars,cpcontacts,ww,ww1,ww2,ww3,dns,dash,gov,edu,ac,pb,voip,abydoss,drs,bg5drs,cc,ddns,api,icp,mail,autodiscover,365"
DOMAINS = "rol.moe,kivotos.edu.kg"
EMAIL_VERIFICATION_REQUIRED = "true"
EMAIL_DAILY_EMAIL_LIMIT = "5"
MAX_RECORDS_PER_SUBDOMAIN = "1000"
MAX_SUBDOMAINS_PER_USER = "5"
SITE_LOGO = "https://sukicdn.com/bg5drs/i/2026/07/04/10ckw.png"
SITE_NAME = "R.O.L. Domain System"
SMTP_FROM = "noreply@rol.moe"
SMTP_FROM_NAME = "R.O.L. Domain System-noreply"

# ========== 未提供 / 可选（保持注释；如需可移除 # 启用，仅限非机密） ==========
# SITE_BACKGROUND_IMAGE = "https://..."
# SITE_BACKGROUND_OVERLAY = "rgba(15, 23, 42, 0.7)"
# SITE_BEIAN = "浙ICP备12345678号-1"
# FRIEND_LINKS = '[{"name":"我的博客","url":"https://blog.example.com"}]'
# 走 Resend 时 SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS 无需配置（仅 SMTP_FROM / SMTP_FROM_NAME 已启用）
